name: Tessera Execution System CI
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  sim:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y iverilog
      - run: iverilog -g2012 -Wall -s tb_tessera_execution_system -o /tmp/e.vvp rtl/tessera_dispatcher.sv rtl/tessera_command_fifo.sv rtl/tessera_dependency_scoreboard.sv rtl/tessera_vec_tile.sv rtl/tessera_tensor_tile.sv rtl/tessera_execution_system.sv tb/tb_tessera_execution_system.sv && vvp /tmp/e.vvp
  synth:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y yosys
      - name: Generic synthesis and cell statistics
        shell: bash
        run: |
          set -o pipefail
          yosys -p 'read_verilog -sv rtl/tessera_dispatcher.sv rtl/tessera_command_fifo.sv rtl/tessera_dependency_scoreboard.sv rtl/tessera_vec_tile.sv rtl/tessera_tensor_tile.sv rtl/tessera_execution_system.sv; hierarchy -check -top tessera_execution_system; proc; check; synth -top tessera_execution_system; check; stat' 2>&1 | tee /tmp/tessera-generic-synth.log
      - name: ECP5 mapping resource estimate
        id: ecp5
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          yosys -p 'read_verilog -sv rtl/tessera_dispatcher.sv rtl/tessera_command_fifo.sv rtl/tessera_dependency_scoreboard.sv rtl/tessera_vec_tile.sv rtl/tessera_tensor_tile.sv rtl/tessera_execution_system.sv; hierarchy -check -top tessera_execution_system; synth_ecp5 -top tessera_execution_system; stat' 2>&1 | tee /tmp/tessera-ecp5-synth.log
      - name: Upload synthesis reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tessera-execution-system-synthesis-reports
          path: |
            /tmp/tessera-generic-synth.log
            /tmp/tessera-ecp5-synth.log
          if-no-files-found: warn
          retention-days: 30
