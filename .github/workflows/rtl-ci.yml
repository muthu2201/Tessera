name: Tessera RTL CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  software-reference:
    name: Software reference model
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Test software semantics
        run: python -m unittest discover -s software -p 'test_*.py' -v
  simulation:
    name: Sim - ${{ matrix.suite }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        suite: [dispatcher, fifo, command-path, completion-queue, control-plane, vector-tile, vector-system, tensor-tile, dependency-scoreboard]
    steps:
      - uses: actions/checkout@v4
      - name: Install simulator
        run: sudo apt-get update && sudo apt-get install -y iverilog
      - name: Run isolated test suite
        shell: bash
        run: |
          mkdir -p build
          case "${{ matrix.suite }}" in
            dispatcher) iverilog -g2012 -Wall -s tb_tessera_dispatcher -o build/test.vvp rtl/tessera_dispatcher.sv tb/tb_tessera_dispatcher.sv && vvp build/test.vvp ;;
            fifo) iverilog -g2012 -Wall -s tb_tessera_command_fifo -o build/test.vvp rtl/tessera_command_fifo.sv tb/tb_tessera_command_fifo.sv && vvp build/test.vvp ;;
            command-path) iverilog -g2012 -Wall -s tb_tessera_command_path -o build/test.vvp rtl/tessera_dispatcher.sv rtl/tessera_command_fifo.sv rtl/tessera_command_path.sv tb/tb_tessera_command_path.sv && vvp build/test.vvp ;;
            completion-queue) iverilog -g2012 -Wall -s tb_tessera_completion_queue -o build/test.vvp rtl/tessera_command_fifo.sv rtl/tessera_completion_queue.sv tb/tb_tessera_completion_queue.sv && vvp build/test.vvp ;;
            control-plane) iverilog -g2012 -Wall -s tb_tessera_control_plane -o build/test.vvp rtl/tessera_dispatcher.sv rtl/tessera_command_fifo.sv rtl/tessera_command_path.sv rtl/tessera_completion_queue.sv rtl/tessera_control_plane.sv tb/tb_tessera_control_plane.sv && vvp build/test.vvp ;;
            vector-tile) iverilog -g2012 -Wall -s tb_tessera_vec_tile -o build/test.vvp rtl/tessera_vec_tile.sv tb/tb_tessera_vec_tile.sv && vvp build/test.vvp ;;
            vector-system) iverilog -g2012 -Wall -s tb_tessera_vec_system -o build/test.vvp rtl/tessera_dispatcher.sv rtl/tessera_command_fifo.sv rtl/tessera_dependency_scoreboard.sv rtl/tessera_vec_tile.sv rtl/tessera_vec_system.sv tb/tb_tessera_vec_system.sv && vvp build/test.vvp ;;
            tensor-tile) iverilog -g2012 -Wall -s tb_tessera_tensor_tile -o build/test.vvp rtl/tessera_tensor_tile.sv tb/tb_tessera_tensor_tile.sv && vvp build/test.vvp ;;
            dependency-scoreboard) iverilog -g2012 -Wall -s tb_tessera_dependency_scoreboard -o build/test.vvp rtl/tessera_dependency_scoreboard.sv tb/tb_tessera_dependency_scoreboard.sv && vvp build/test.vvp ;;
          esac
  synthesis:
    name: Synth - ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        target: [dispatcher, fifo, command-path, completion-queue, control-plane, vector-tile, vector-system, tensor-tile, dependency-scoreboard]
    steps:
      - uses: actions/checkout@v4
      - name: Install synthesis tools
        run: sudo apt-get update && sudo apt-get install -y yosys
      - name: Synthesize and check structure
        shell: bash
        run: |
          case "${{ matrix.target }}" in
            dispatcher) yosys -p 'read_verilog -sv rtl/tessera_dispatcher.sv; hierarchy -check -top tessera_dispatcher; proc; check; synth -top tessera_dispatcher; check; stat' ;;
            fifo) yosys -p 'read_verilog -sv rtl/tessera_command_fifo.sv; hierarchy -check -top tessera_command_fifo; proc; check; synth -top tessera_command_fifo; check; stat' ;;
            command-path) yosys -p 'read_verilog -sv rtl/tessera_dispatcher.sv rtl/tessera_command_fifo.sv rtl/tessera_command_path.sv; hierarchy -check -top tessera_command_path; proc; check; synth -top tessera_command_path; check; stat' ;;
            completion-queue) yosys -p 'read_verilog -sv rtl/tessera_command_fifo.sv rtl/tessera_completion_queue.sv; hierarchy -check -top tessera_completion_queue; proc; check; synth -top tessera_completion_queue; check; stat' ;;
            control-plane) yosys -p 'read_verilog -sv rtl/tessera_dispatcher.sv rtl/tessera_command_fifo.sv rtl/tessera_command_path.sv rtl/tessera_completion_queue.sv rtl/tessera_control_plane.sv; hierarchy -check -top tessera_control_plane; proc; check; synth -top tessera_control_plane; check; stat' ;;
            vector-tile) yosys -p 'read_verilog -sv rtl/tessera_vec_tile.sv; hierarchy -check -top tessera_vec_tile; proc; check; synth -top tessera_vec_tile; check; stat' ;;
            vector-system) yosys -p 'read_verilog -sv rtl/tessera_dispatcher.sv rtl/tessera_command_fifo.sv rtl/tessera_dependency_scoreboard.sv rtl/tessera_vec_tile.sv rtl/tessera_vec_system.sv; hierarchy -check -top tessera_vec_system; proc; check; synth -top tessera_vec_system; check; stat' ;;
            tensor-tile) yosys -p 'read_verilog -sv rtl/tessera_tensor_tile.sv; hierarchy -check -top tessera_tensor_tile; proc; check; synth -top tessera_tensor_tile; check; stat' ;;
            dependency-scoreboard) yosys -p 'read_verilog -sv rtl/tessera_dependency_scoreboard.sv; hierarchy -check -top tessera_dependency_scoreboard; proc; check; synth -top tessera_dependency_scoreboard; check; stat' ;;
          esac
  fpga-estimate:
    name: FPGA - ECP5 resource and timing estimate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install FPGA tools
        run: sudo apt-get update && sudo apt-get install -y yosys nextpnr-ecp5
      - name: Map dispatcher and estimate placement
        run: |
          mkdir -p build
          yosys -p 'read_verilog -sv rtl/tessera_dispatcher.sv; synth_ecp5 -top tessera_dispatcher -json build/tessera_ecp5.json'
          nextpnr-ecp5 --25k --package CABGA381 --speed 6 --json build/tessera_ecp5.json --textcfg build/tessera_ecp5.config --lpf-allow-unconstrained --freq 50
      - name: Upload synthesis artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tessera-ecp5-build
          path: |
            build/tessera_ecp5.json
            build/tessera_ecp5.config
          if-no-files-found: ignore
